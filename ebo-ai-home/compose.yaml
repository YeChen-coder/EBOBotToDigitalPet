name: ebo-ai-home

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ebo-ai-home-homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant-config:/config
      - ./media:/media
      - ./ha-llmvision/custom_components/llmvision:/config/custom_components/llmvision:ro
      - ./ha-enabot/ebo/ha_integration/custom_components/ebo:/config/custom_components/ebo:ro
    environment:
      TZ: ${TZ:-America/Toronto}
    networks:
      - ai-camera

  # Optional adapter for Enabot's cloud camera/control protocol. Home Assistant and
  # LLM Vision do not depend on this service, so another camera can replace it later.
  ebo-engine:
    image: ebo-ai-home/ebo-engine:0.26.100
    build:
      context: ./ha-enabot/ebo
    container_name: ebo-ai-home-ebo-engine
    # The assistant profile also needs the RTSP/API adapter.
    profiles: ["ebo", "assistant"]
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8098:8098"
      # Local-only copy of the EBO control panel. It has no standalone login because
      # Home Assistant OS normally protects it with Ingress, so never expose it on LAN.
      - "127.0.0.1:8101:8099"
      - "8554-8557:8554-8557"
      - "8189-8192:8189-8192/tcp"
      - "8189-8192:8189-8192/udp"
    expose:
      # PCM talkback is intentionally reachable only by containers on ai-camera.
      - "8200"
    volumes:
      - ./ebo-data:/data
    environment:
      # Stable name used in discovery URLs consumed by HA. Never use Docker's changing container id.
      EBO_API_HOST: ebo-engine
      EBO_TALK_STREAM_PORT: ${EBO_TALK_STREAM_PORT:-8200}
      # Mirror Docker stdout to the host-mounted ebo-data/logs directory with rotation.
      EBO_HOST_LOG_PATH: ${EBO_HOST_LOG_PATH:-/data/logs/ebo-engine.log}
      EBO_HOST_LOG_MAX_BYTES: ${EBO_HOST_LOG_MAX_BYTES:-10485760}
      EBO_HOST_LOG_BACKUP_COUNT: ${EBO_HOST_LOG_BACKUP_COUNT:-5}
      TZ: ${TZ:-America/Toronto}
      # Agora Server SDK audio processing. Keep these explicit so each processor can be A/B tested.
      EBO_AGORA_AEC_ENABLED: ${EBO_AGORA_AEC_ENABLED:-false}
      EBO_AGORA_NOISE_SUPPRESSION_ENABLED: ${EBO_AGORA_NOISE_SUPPRESSION_ENABLED:-false}
      EBO_AGORA_AGC_ENABLED: ${EBO_AGORA_AGC_ENABLED:-false}
    networks:
      - ai-camera

  # Specter conversation framework with the existing EBO Engine PCM transport.
  realtime-assistant:
    build:
      context: ./realtime-assistant
    image: ebo-ai-home/realtime-assistant:2.0.0
    container_name: ebo-ai-home-realtime-assistant
    profiles: ["assistant"]
    restart: unless-stopped
    init: true
    stop_grace_period: 65s
    depends_on:
      - ebo-engine
      - frigate
      - mosquitto
    ports:
      - "127.0.0.1:8099:8099"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1-mini}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
      OPENAI_REALTIME_OUTPUT_SPEED: ${OPENAI_REALTIME_OUTPUT_SPEED:-1.0}
      OPENAI_INPUT_TRANSCRIPTION_MODEL: ${OPENAI_INPUT_TRANSCRIPTION_MODEL:-gpt-transcribe}
      OPENAI_INPUT_TRANSCRIPTION_DELAY: ${OPENAI_INPUT_TRANSCRIPTION_DELAY:-}
      OPENAI_INPUT_TRANSCRIPTION_KEYWORDS_JSON: '${OPENAI_INPUT_TRANSCRIPTION_KEYWORDS_JSON:-[]}'
      OPENAI_INPUT_TRANSCRIPTION_LANGUAGE: ${OPENAI_INPUT_TRANSCRIPTION_LANGUAGE:-}
      OPENAI_INPUT_TRANSCRIPTION_LANGUAGES_JSON: '${OPENAI_INPUT_TRANSCRIPTION_LANGUAGES_JSON:-[]}'
      OPENAI_INPUT_TRANSCRIPTION_PROMPT: ${OPENAI_INPUT_TRANSCRIPTION_PROMPT:-}
      OPENAI_LIVE_TRANSCRIPTION_ENABLED: ${OPENAI_LIVE_TRANSCRIPTION_ENABLED:-true}
      OPENAI_LIVE_TRANSCRIPTION_MODEL: ${OPENAI_LIVE_TRANSCRIPTION_MODEL:-gpt-live-transcribe}
      OPENAI_LIVE_TRANSCRIPTION_DELAY: ${OPENAI_LIVE_TRANSCRIPTION_DELAY:-low}
      OPENAI_LIVE_TRANSCRIPTION_LANGUAGES_JSON: '${OPENAI_LIVE_TRANSCRIPTION_LANGUAGES_JSON:-["zh"]}'
      OPENAI_LIVE_TRANSCRIPTION_PROMPT: ${OPENAI_LIVE_TRANSCRIPTION_PROMPT:-}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-gpt-5.4-mini}
      OPENAI_RESEARCH_TIMEOUT_SECONDS: ${OPENAI_RESEARCH_TIMEOUT_SECONDS:-90}
      EBO_ASSISTANT_INSTRUCTIONS: ${EBO_ASSISTANT_INSTRUCTIONS:-}
      EBO_API_TOKEN: ${EBO_API_TOKEN:-}
      EBO_ASSISTANT_CONTROL_TOKEN: ${EBO_ASSISTANT_CONTROL_TOKEN:-}
      EBO_NODE: ${EBO_NODE:-ebo}
      EBO_API_URL: ${EBO_API_URL:-http://ebo-engine:8098}
      EBO_RTSP_URL: ${EBO_RTSP_URL:-rtsp://ebo-engine:8554/ebo}
      EBO_TALK_STREAM_URL: ${EBO_TALK_STREAM_URL:-ws://ebo-engine:8200/talk}
      EBO_AUDIO_STREAM_URL: ${EBO_AUDIO_STREAM_URL:-}
      EBO_ASSISTANT_AUDIO_URL: ${EBO_ASSISTANT_AUDIO_URL:-http://realtime-assistant:8099/audio}
      EBO_STREAM_PREBUFFER_MS: ${EBO_STREAM_PREBUFFER_MS:-200}
      EBO_STREAM_CONNECT_TIMEOUT_SECONDS: ${EBO_STREAM_CONNECT_TIMEOUT_SECONDS:-10}
      EBO_AUTO_WAKE: ${EBO_AUTO_WAKE:-true}
      EBO_FRIGATE_URL: ${EBO_FRIGATE_URL:-http://frigate:5000}
      EBO_CAMERA_NAME: ${EBO_CAMERA_NAME:-ebo}
      EBO_MQTT_HOST: ${EBO_MQTT_HOST:-mosquitto}
      EBO_MQTT_PORT: ${EBO_MQTT_PORT:-1883}
      EBO_USERS_JSON: '${EBO_USERS_JSON:-}'
      EBO_PROACTIVE_GREETING_ENABLED: ${EBO_PROACTIVE_GREETING_ENABLED:-false}
      EBO_VOICE_WAKE_ENABLED: ${EBO_VOICE_WAKE_ENABLED:-true}
      EBO_PLAYBACK_TAIL_MS: ${EBO_PLAYBACK_TAIL_MS:-800}
      EBO_VISUAL_ENABLED: ${EBO_VISUAL_ENABLED:-true}
      EBO_MIN_FACE_SCORE: ${EBO_MIN_FACE_SCORE:-0.90}
      EBO_MIN_PERSON_AREA: ${EBO_MIN_PERSON_AREA:-40000}
      EBO_ABSENCE_SECONDS: ${EBO_ABSENCE_SECONDS:-25}
      EBO_COOLDOWN_SECONDS: ${EBO_COOLDOWN_SECONDS:-90}
      EBO_SESSION_IDLE_SECONDS: ${EBO_SESSION_IDLE_SECONDS:-600}
      EBO_SESSION_MAX_SECONDS: ${EBO_SESSION_MAX_SECONDS:-2700}
      EBO_SERVER_NOISE_REDUCTION: ${EBO_SERVER_NOISE_REDUCTION:-far_field}
      REALTIME_VAD_THRESHOLD: ${REALTIME_VAD_THRESHOLD:-0.65}
      EBO_VAD_PREFIX_PADDING_MS: ${EBO_VAD_PREFIX_PADDING_MS:-300}
      EBO_VAD_SILENCE_DURATION_MS: ${EBO_VAD_SILENCE_DURATION_MS:-650}
      EBO_BARGE_IN_ENABLED: ${EBO_BARGE_IN_ENABLED:-false}
      EBO_BARGE_IN_CONFIRM_MS: ${EBO_BARGE_IN_CONFIRM_MS:-300}
      EBO_BARGE_IN_PREROLL_MS: ${EBO_BARGE_IN_PREROLL_MS:-500}
      EBO_BARGE_IN_VAD_MODE: ${EBO_BARGE_IN_VAD_MODE:-2}
      EBO_BARGE_IN_ECHO_CORRELATION: ${EBO_BARGE_IN_ECHO_CORRELATION:-0.65}
      EBO_BARGE_IN_RESIDUAL_RATIO: ${EBO_BARGE_IN_RESIDUAL_RATIO:-0.45}
      EBO_AEC_ENABLED: ${EBO_AEC_ENABLED:-true}
      EBO_AEC_DELAY_MS: ${EBO_AEC_DELAY_MS:-0}
      EBO_AEC_WARMUP_MS: ${EBO_AEC_WARMUP_MS:-500}
      REALTIME_IMAGE_WIDTH: ${REALTIME_IMAGE_WIDTH:-768}
      REALTIME_IMAGE_QUALITY: ${REALTIME_IMAGE_QUALITY:-75}
      EBO_TRACE_ENABLED: ${EBO_TRACE_ENABLED:-false}
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: ${OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA:-false}
      EBO_MEDIA_STALE_AFTER_SECONDS: ${EBO_MEDIA_STALE_AFTER_SECONDS:-20}
      EBO_MEDIA_STARTUP_GRACE_SECONDS: ${EBO_MEDIA_STARTUP_GRACE_SECONDS:-90}
      EBO_TRANSCRIPT_PATH: ${EBO_TRANSCRIPT_PATH:-/data/transcripts.jsonl}
      EBO_LIVE_TRANSCRIPT_PATH: ${EBO_LIVE_TRANSCRIPT_PATH:-/data/live_transcripts.jsonl}
      EBO_OUTPUT_AUDIO_DIR: ${EBO_OUTPUT_AUDIO_DIR:-/data/replies}
      EBO_ASSISTANT_TRANSCRIPT_PATH: ${EBO_ASSISTANT_TRANSCRIPT_PATH:-/data/assistant_outputs.jsonl}
      EBO_MEMORY_ROOT: ${EBO_MEMORY_ROOT:-/data/memory-v2}
      EBO_MEMORY_MODEL: ${EBO_MEMORY_MODEL:-gpt-5.4-mini}
      EBO_MEMORY_TIMEOUT_SECONDS: ${EBO_MEMORY_TIMEOUT_SECONDS:-45}
      EBO_LONG_TERM_MEMORY_MODEL: ${EBO_LONG_TERM_MEMORY_MODEL:-gpt-6-sol}
      EBO_LONG_TERM_MEMORY_TIMEOUT_SECONDS: ${EBO_LONG_TERM_MEMORY_TIMEOUT_SECONDS:-120}
      EBO_MEMORY_CONSOLIDATION_HOURS: ${EBO_MEMORY_CONSOLIDATION_HOURS:-24}
      EBO_REALTIME_MEMORY_MAX_CHARS: ${EBO_REALTIME_MEMORY_MAX_CHARS:-6000}
      TZ: ${TZ:-America/Toronto}
    tmpfs: [/tmp]
    volumes:
      - ./assistant-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=2)); sys.exit(0 if h.get('ok') else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks: [ai-camera]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ebo-ai-home-mosquitto
    profiles: ["assistant"]
    restart: unless-stopped
    volumes:
      - ./frigate/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [ai-camera]

  frigate:
    # Same image digest as the reference project; no reference faces or memories.
    image: ghcr.io/blakeblackshear/frigate@sha256:82d7475ba7e5f950911bd9d06f2392de96881f39eeacd78824a526dde9b5cad9
    container_name: ebo-ai-home-frigate
    profiles: ["assistant"]
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    depends_on: [ebo-engine, mosquitto]
    environment:
      FRIGATE_EBO_RTSP_URL: ${EBO_RTSP_URL:-rtsp://ebo-engine:8554/ebo}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ./frigate-data:/config
      - ./frigate/config.yml:/config/config.yml:ro
      - ./frigate-media:/media/frigate
    tmpfs:
      - /tmp/cache:size=100000000
    ports:
      - "127.0.0.1:8973:8971"
    networks: [ai-camera]

networks:
  ai-camera:
    name: ebo-ai-home-network
    driver: bridge
